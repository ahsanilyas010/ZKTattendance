[project]
name = "zkagent"
version = "0.1.0"
description = "On-site connector: pulls punches from ZKTeco terminals and syncs them to the cloud dashboard"
requires-python = ">=3.10"
dependencies = ["pyzk==0.9", "requests>=2.31", "tzdata"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
zkagent = "zkagent.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zkagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
